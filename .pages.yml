# Pages CMS 配置 —— 在 app.pagescms.org 连上这个仓库后，
# 这三块会变成三个表单，不需要碰任何代码。
# 文档：https://pagescms.org/docs/configuration/

media:
  input: media
  output: /media

content:
  - name: site
    label: 首页
    type: file
    path: data/site.json
    fields:
      - name: name
        label: 名字
        type: string

      - name: now
        label: 正在做的东西
        type: object
        fields:
          - name: image
            label: 图片
            type: image
          - name: alt
            label: 图片描述（读屏用，可空）
            type: string
          - name: caption
            label: 一句话
            type: string

      - name: doors
        label: 两扇门
        type: object
        list:
          collapsible: true
          summary: "{{label}}"
        fields:
          - name: label
            label: 名字
            type: string
          - name: href
            label: 链接
            type: string

  - name: albums
    label: 相册
    type: file
    path: data/albums.json
    fields:
      - name: albums
        label: 相册列表
        type: object
        list:
          collapsible: true
          summary: "{{title}}"
        fields:
          - name: title
            label: 相册名
            type: string
          - name: slug
            label: 网址片段（英文小写，不要空格）
            type: string
          - name: date
            label: 日期
            type: string
          - name: cover
            label: 封面
            type: image

  - name: made
    label: 做过的事
    type: file
    path: data/made.json
    fields:
      - name: items
        label: 列表
        type: object
        list:
          collapsible: true
          summary: "{{title}}"
        fields:
          - name: title
            label: 名字
            type: string
          - name: note
            label: 一句话
            type: string
          - name: href
            label: 链接
            type: string
          - name: cover
            label: 图片
            type: image
